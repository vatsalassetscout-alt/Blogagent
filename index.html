<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads Dashboard — Rank Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #060a12;
      --surface:   #0d1420;
      --surface2:  #111827;
      --border:    #1a2332;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --blue:      #3b82f6;
      --blue-dim:  #1d4ed8;
      --purple:    #8b5cf6;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
      --radius:    10px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
    }
    [data-theme="light"] {
      --bg:       #f1f5f9;
      --surface:  #ffffff;
      --surface2: #f8fafc;
      --border:   #e2e8f0;
      --text:     #0f172a;
      --muted:    #64748b;
      --shadow:   0 4px 24px rgba(0,0,0,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 28px;
      height: 62px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
    .header-logo { height: 30px; object-fit: contain; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .web-btn {
      padding: 6px 16px; background: var(--blue); color: #fff;
      border-radius: 6px; font-size: .85rem; font-weight: 600;
      text-decoration: none; transition: background .15s;
    }
    .web-btn:hover { background: var(--blue-dim); }
    .theme-toggle {
      display: flex; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px; gap: 2px;
    }
    .theme-btn {
      border: none; background: transparent; cursor: pointer;
      padding: 4px 8px; border-radius: 16px; font-size: .9rem;
      transition: background .15s; line-height: 1;
    }
    .theme-btn.active { background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.3); }

    .page { display: none; padding: 28px; max-width: 1400px; margin: 0 auto; }
    .page.active { display: block; }

    .metrics {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; margin-bottom: 28px;
    }
    @media (max-width: 900px) { .metrics { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 500px) { .metrics { grid-template-columns: 1fr; } }

    .metric-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 22px;
      display: flex; flex-direction: column; gap: 6px; transition: border-color .2s;
    }
    .metric-card:hover { border-color: var(--blue); }
    .metric-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .metric-value { font-size: 2rem; font-weight: 800; line-height: 1; }
    .metric-value.blue   { color: var(--blue); }
    .metric-value.purple { color: var(--purple); }
    .metric-value.green  { color: var(--green); }
    .metric-value.yellow { color: var(--yellow); }
    .metric-sub { font-size: .75rem; color: var(--muted); }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
    }
    .section-title { font-size: 1.25rem; font-weight: 700; }
    .section-sub   { font-size: .85rem; color: var(--muted); margin-top: 2px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border: none; border-radius: 8px;
      font-size: .875rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s, background .15s; white-space: nowrap;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-dim); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid transparent; }
    .btn-danger:hover:not(:disabled) { border-color: var(--red); }
    .btn-sm { padding: 5px 12px; font-size: .8rem; }

    .domain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .domain-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      transition: border-color .2s, transform .15s;
    }
    .domain-card:hover { border-color: var(--blue); transform: translateY(-2px); }
    .domain-card-head {
      padding: 16px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .domain-name { font-weight: 700; font-size: 1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 220px; }
    .domain-card-body { padding: 16px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .domain-stat-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
    .domain-stat-value { font-size: 1.5rem; font-weight: 800; }

    .empty {
      text-align: center; padding: 64px 24px; border: 1px dashed var(--border);
      border-radius: var(--radius); background: var(--surface);
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .4; }
    .empty h3   { font-size: 1.1rem; margin-bottom: 6px; }
    .empty p    { font-size: .875rem; color: var(--muted); max-width: 340px; margin: 0 auto 20px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer; color: var(--blue);
      font-size: .875rem; font-weight: 600; padding: 0; margin-bottom: 20px;
    }
    .back-btn:hover { text-decoration: underline; }

    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--surface2); }
    th {
      padding: 12px 16px; text-align: left; font-size: .7rem;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      font-weight: 700; white-space: nowrap;
    }
    td { padding: 12px 16px; font-size: .875rem; border-top: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: var(--surface2); }

    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: .85rem;
    }
    .rank-top1  { background: rgba(34,197,94,.15);   color: var(--green); }
    .rank-top3  { background: rgba(59,130,246,.15);  color: var(--blue); }
    .rank-top10 { background: rgba(139,92,246,.15);  color: var(--purple); }
    .rank-top30 { background: rgba(245,158,11,.15);  color: var(--yellow); }
    .rank-low   { background: rgba(100,116,139,.12); color: var(--muted); }
    .rank-none  { color: var(--muted); font-size: .8rem; }

    .change-pos { color: var(--green); font-weight: 600; }
    .change-neg { color: var(--red);   font-weight: 600; }
    .change-neu { color: var(--muted); }

    .keyword-cell { font-weight: 600; }
    .url-link { color: var(--blue); text-decoration: none; font-size: .8rem; max-width: 200px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-link:hover { text-decoration: underline; }

    .spinner-wrap { text-align: center; padding: 60px; color: var(--muted); }
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      padding: 12px 18px; border-radius: 8px; font-size: .875rem; font-weight: 500;
      color: #fff; box-shadow: var(--shadow); animation: slideUp .2s ease; max-width: 320px;
    }
    .toast.success { background: #166534; }
    .toast.error   { background: #7f1d1d; }
    .toast.info    { background: #1e3a5f; }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 480px;
      box-shadow: var(--shadow); animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
    .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title  { font-size: 1.05rem; font-weight: 700; }
    .modal-close  { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 2px 6px; border-radius: 4px; }
    .modal-close:hover { color: var(--text); background: var(--surface2); }
    .modal-body   { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

    .field label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 9px 12px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 7px; color: var(--text);
      font-size: .9rem; outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--blue); }
    .field input::placeholder { color: var(--muted); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .checking { opacity: .5; pointer-events: none; }
    .checking td:first-child::before { content: "⏳ "; }
  </style>
</head>
<body>

<div class="header">
  <div style="flex:1;display:flex;align-items:center;gap:14px;">
    <h1>Leads Dashboard</h1>
  </div>
  <img class="header-logo" src="https://assetscout.in/assets/images/Assetscout%20Logo%20Black.webp" alt="Asset Scout" onerror="this.style.display='none'">
  <div class="header-right">
    <a href="index.html" target="_self" class="web-btn" id="webDashboardBtn">Web</a>
    <div class="theme-toggle">
      <button class="theme-btn" id="btnLight" onclick="setTheme('light')">☀️</button>
      <button class="theme-btn active" id="btnDark" onclick="setTheme('dark')">🌙</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- PAGE: DOMAIN LIST -->
<div class="page active" id="page-domains">
  <div class="metrics" style="margin-top:24px;">
    <div class="metric-card">
      <div class="metric-label">Total Domains</div>
      <div class="metric-value blue" id="m-domains">—</div>
      <div class="metric-sub">tracked properties</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Total Keywords</div>
      <div class="metric-value purple" id="m-keywords">—</div>
      <div class="metric-sub">across all domains</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Top 1 Count</div>
      <div class="metric-value green" id="m-top1">—</div>
      <div class="metric-sub">ranking #1</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Top 10 Count</div>
      <div class="metric-value yellow" id="m-top10">—</div>
      <div class="metric-sub">on page 1</div>
    </div>
  </div>

  <div class="section-header">
    <div>
      <div class="section-title">Domains</div>
      <div class="section-sub">Monitor search visibility across all tracked properties.</div>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">＋ Add Keyword</button>
  </div>

  <div id="domains-container">
    <div class="spinner-wrap"><div class="spinner"></div><div>Loading domains…</div></div>
  </div>
</div>

<!-- PAGE: DOMAIN DETAIL -->
<div class="page" id="page-detail">
  <button class="back-btn" onclick="showDomains()">← Back to Domains</button>
  <div class="section-header">
    <div>
      <div class="section-title" id="detail-title">Domain</div>
      <div class="section-sub" id="detail-sub"></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" onclick="checkAllRanks()" id="btn-check-all">🔄 Check All</button>
      <button class="btn btn-primary" onclick="openAddModal()">＋ Add Keyword</button>
    </div>
  </div>
  <div id="keywords-container">
    <div class="spinner-wrap"><div class="spinner"></div><div>Loading keywords…</div></div>
  </div>
</div>

<!-- ADD KEYWORD MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfBackdrop(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add Keyword</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Keyword *</label>
        <input type="text" id="f-keyword" placeholder="e.g. buy running shoes" />
      </div>
      <div class="field">
        <label>Domain *</label>
        <input type="text" id="f-domain" placeholder="e.g. example.com" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Location</label>
          <input type="text" id="f-location" placeholder="United States" value="United States" />
        </div>
        <div class="field">
          <label>Language</label>
          <select id="f-language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh-cn">Chinese (Simplified)</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="btn-add" onclick="addKeyword()">Add Keyword</button>
    </div>
  </div>
</div>

<script>
let currentDomain = null;
let allDomains    = [];
let allKeywords   = [];

function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btnLight').classList.toggle('active', t === 'light');
  document.getElementById('btnDark').classList.toggle('active',  t === 'dark');
  localStorage.setItem('rk-theme', t);
}
(function initTheme() {
  setTheme(localStorage.getItem('rk-theme') || 'dark');
})();

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

const BASE = '/api';
async function api(path, opts = {}) {
  const res = await fetch(BASE + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

function showDomains() {
  currentDomain = null;
  document.getElementById('page-domains').classList.add('active');
  document.getElementById('page-detail').classList.remove('active');
  loadDomains();
}

function showDetail(domain) {
  currentDomain = domain;
  document.getElementById('page-domains').classList.remove('active');
  document.getElementById('page-detail').classList.add('active');
  document.getElementById('detail-title').textContent = domain;
  document.getElementById('detail-sub').textContent = 'Keyword rankings for ' + domain;
  loadKeywords(domain);
}

async function loadDomains() {
  const container = document.getElementById('domains-container');
  container.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div><div>Loading domains…</div></div>';
  try {
    allDomains = await api('/domains');
    updateMetrics(allDomains);
    renderDomains(allDomains);
  } catch (e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Failed to load</h3><p>${e.message}</p></div>`;
  }
}

function updateMetrics(domains) {
  document.getElementById('m-domains').textContent  = domains.length;
  const totalKw = domains.reduce((s, d) => s + (d.keywordCount || 0), 0);
  document.getElementById('m-keywords').textContent = totalKw;
  fetchGlobalMetrics();
}

async function fetchGlobalMetrics() {
  try {
    const kws = await api('/keywords');
    document.getElementById('m-top1').textContent  = kws.filter(k => k.currentRank === 1).length;
    document.getElementById('m-top10').textContent = kws.filter(k => k.currentRank != null && k.currentRank <= 10).length;
  } catch { /* silent */ }
}

function renderDomains(domains) {
  const container = document.getElementById('domains-container');
  if (!domains.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎯</div>
        <h3>No domains tracked yet</h3>
        <p>Add your first keyword to start tracking Google rankings.</p>
        <button class="btn btn-primary" onclick="openAddModal()">Add First Keyword</button>
      </div>`;
    return;
  }
  container.innerHTML = `<div class="domain-grid">${domains.map(domainCard).join('')}</div>`;
}

function domainCard(d) {
  const avg = d.avgRank != null ? d.avgRank.toFixed(1) : '—';
  return `
    <div class="domain-card" onclick="showDetail('${esc(d.domain)}')">
      <div class="domain-card-head">
        <div class="domain-name">${esc(d.domain)}</div>
        <span style="color:var(--muted);font-size:.8rem;">↗</span>
      </div>
      <div class="domain-card-body">
        <div><div class="domain-stat-label">Keywords</div><div class="domain-stat-value" style="color:var(--blue)">${d.keywordCount}</div></div>
        <div><div class="domain-stat-label">Avg Rank</div><div class="domain-stat-value">${avg}</div></div>
        <div><div class="domain-stat-label">Top 3</div><div class="domain-stat-value" style="color:var(--green)">${d.top3Count || 0}</div></div>
        <div><div class="domain-stat-label">Top 10</div><div class="domain-stat-value" style="color:var(--purple)">${d.top10Count || 0}</div></div>
      </div>
    </div>`;
}

async function loadKeywords(domain) {
  const container = document.getElementById('keywords-container');
  container.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div><div>Loading keywords…</div></div>';
  try {
    allKeywords = await api('/keywords?domain=' + encodeURIComponent(domain));
    renderKeywords(allKeywords);
  } catch (e) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Failed to load</h3><p>${e.message}</p></div>`;
  }
}

function rankBadge(rank) {
  if (rank == null) return '<span class="rank-none">—</span>';
  let cls = rank === 1 ? 'rank-top1' : rank <= 3 ? 'rank-top3' : rank <= 10 ? 'rank-top10' : rank <= 30 ? 'rank-top30' : 'rank-low';
  return `<span class="rank-badge ${cls}">#${rank}</span>`;
}

function changeCell(c) {
  if (c == null) return '<span class="change-neu">—</span>';
  if (c > 0) return `<span class="change-pos">↑${c}</span>`;
  if (c < 0) return `<span class="change-neg">↓${Math.abs(c)}</span>`;
  return '<span class="change-neu">—</span>';
}

function renderKeywords(kws) {
  const container = document.getElementById('keywords-container');
  if (!kws.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📊</div>
        <h3>No keywords yet</h3>
        <p>Add keywords to start tracking rankings for ${esc(currentDomain)}.</p>
        <button class="btn btn-primary" onclick="openAddModal()">Add Keyword</button>
      </div>`;
    return;
  }
  const rows = kws.map(k => `
    <tr id="row-${k.id}">
      <td class="keyword-cell">${esc(k.keyword)}</td>
      <td>${rankBadge(k.currentRank)}</td>
      <td>${changeCell(k.rankChange)}</td>
      <td>${k.bestRank != null ? '#' + k.bestRank : '—'}</td>
      <td>${k.rankUrl ? `<a class="url-link" href="${esc(k.rankUrl)}" target="_blank">${esc(k.rankUrl)}</a>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td>${k.lastChecked ? fmtDate(k.lastChecked) : '<span style="color:var(--muted)">Never</span>'}</td>
      <td>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="checkKeyword('${k.id}')">🔍</button>
          <button class="btn btn-danger btn-sm" onclick="deleteKeyword('${k.id}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Keyword</th><th>Current Rank</th><th>Change</th>
            <th>Best Rank</th><th>Ranking URL</th><th>Last Checked</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function checkKeyword(id) {
  const row = document.getElementById('row-' + id);
  if (row) row.classList.add('checking');
  try {
    const updated = await api(`/keywords/${id}/check`, { method: 'POST' });
    toast(`${updated.keyword} → ${updated.currentRank != null ? '#' + updated.currentRank : 'not ranked'}`, 'success');
    allKeywords = allKeywords.map(k => k.id === id ? updated : k);
    renderKeywords(allKeywords);
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
    if (row) row.classList.remove('checking');
  }
}

async function checkAllRanks() {
  const btn = document.getElementById('btn-check-all');
  btn.disabled = true; btn.textContent = '⏳ Checking…';
  try {
    const updated = await api(`/domains/${encodeURIComponent(currentDomain)}/check`, { method: 'POST' });
    allKeywords = updated;
    renderKeywords(allKeywords);
    toast(`Checked ${updated.length} keywords`, 'success');
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '🔄 Check All';
  }
}

async function deleteKeyword(id) {
  if (!confirm('Delete this keyword?')) return;
  try {
    await api(`/keywords/${id}`, { method: 'DELETE' });
    allKeywords = allKeywords.filter(k => k.id !== id);
    renderKeywords(allKeywords);
    toast('Keyword deleted', 'info');
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  }
}

function openAddModal() {
  if (currentDomain) document.getElementById('f-domain').value = currentDomain;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-keyword').focus(), 100);
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalIfBackdrop(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

async function addKeyword() {
  const keyword  = document.getElementById('f-keyword').value.trim();
  const domain   = document.getElementById('f-domain').value.trim();
  const location = document.getElementById('f-location').value.trim() || 'United States';
  const language = document.getElementById('f-language').value;
  if (!keyword || !domain) { toast('Keyword and Domain are required', 'error'); return; }

  const btn = document.getElementById('btn-add');
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    await api('/keywords', { method: 'POST', body: JSON.stringify({ keyword, domain, location, language }) });
    toast(`"${keyword}" added for ${domain}`, 'success');
    closeModal();
    document.getElementById('f-keyword').value  = '';
    document.getElementById('f-domain').value   = '';
    document.getElementById('f-location').value = 'United States';
    document.getElementById('f-language').value = 'en';
    if (currentDomain) loadKeywords(currentDomain);
    else               loadDomains();
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Add Keyword';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) addKeyword();
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

loadDomains();
</script>
</body>
</html>
