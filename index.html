<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Leads Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        /* Existing styles remain unchanged... */
        [data-theme="dark"] {
            --bg: #060a12;
            --s1: #0d1420;
            --s2: #111c2e;
            --s3: #172035;
            --border: #1e2d45;
            --border2: #243553;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #4a5f7a;
            --shadow: rgba(0,0,0,.4);
            --blue: #3b82f6;
            --blue2: #60a5fa;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --purple: #8b5cf6;
            --mono: 'JetBrains Mono', 'SF Mono', monospace;
            --logo-filter: brightness(0) invert(1);
        }
        [data-theme="light"] {
            --bg: #f0f4fa;
            --s1: #ffffff;
            --s2: #f5f8ff;
            --s3: #eaf0fb;
            --border: #d1ddf0;
            --border2: #b8cce4;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --shadow: rgba(0,0,0,.08);
            --blue: #3b82f6;
            --blue2: #2563eb;
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --purple: #8b5cf6;
            --mono: 'JetBrains Mono', 'SF Mono', monospace;
            --logo-filter: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto; }

        /* Chart Container Styles */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .chart-card {
            background: var(--s1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 1px 4px var(--shadow);
        }
        .chart-card h3 {
            font-size: 14px;
            margin-bottom: 15px;
            color: var(--text2);
            font-weight: 600;
            text-align: center;
        }
        .chart-container {
            height: 260px;
            position: relative;
        }

        @media (max-width: 1024px) {
            .charts-container { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
        }

        /* Keep all your existing styles below... */
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 20px 25px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 1px 4px var(--shadow); position: relative; }
        h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        /* ... (all your existing CSS remains the same) ... */
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div style="flex:1;">
            <h1>Leads Dashboard</h1>
        </div>
        <img class="logo-img" src="https://assetscout.in/assets/images/Assetscout%20Logo%20Black.webp" alt="Asset Scout" onerror="this.style.display='none'">
        <div class="header-right">
            <button class="web-btn" id="webDashboardBtn">Web</button>
            <div class="theme-toggle">
                <button class="theme-btn" onclick="setTheme('light')">☀️</button>
                <button class="theme-btn active" onclick="setTheme('dark')">🌙</button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
        <!-- Your existing filter bar remains unchanged -->
        <!-- ... (all your filter code stays exactly the same) ... -->
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="totalLeads">--</div><div class="stat-label">Total Leads</div></div>
        <div class="stat-card"><div class="stat-number" id="totalProjects">--</div><div class="stat-label">Projects</div></div>
        <div class="stat-card"><div class="stat-number" id="totalLocations">--</div><div class="stat-label">Locations</div></div>
        <div class="stat-card"><div class="stat-number" id="totalSources">--</div><div class="stat-label">Sources</div></div>
    </div>

    <!-- NEW CHARTS SECTION -->
    <div class="charts-container">
        <div class="chart-card">
            <h3>Leads Over Time</h3>
            <div class="chart-container">
                <canvas id="timeSeriesChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>Leads by Location</h3>
            <div class="chart-container">
                <canvas id="locationChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3>Leads by Source</h3>
            <div class="chart-container">
                <canvas id="sourceChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Projects Section -->
    <div class="projects-section">
        <div class="section-title">Projects (Click any row to see leads grouped by source)</div>
        <div class="table-header">
            <div class="header-project">Project Name</div>
            <div class="header-location">Location</div>
            <div class="header-count">Lead Count</div>
        </div>
        <div id="projectList">
            <div class="loading">Loading data from Google Sheets...</div>
        </div>
    </div>

    <div class="last-updated" id="lastUpdated">--</div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Lead Details by Source</h3>
            <button class="close-modal" onclick="closeModal()">✕</button>
        </div>
        <div id="timestampsList" class="timestamps-list"></div>
    </div>
</div>

<script>
    // === Your existing variables and functions remain the same ===
    const SHEET_ID = "14TBSWEZ4rlIkLECg2MrBCUYFwy8coCzISZUqJW_lCOc";
    const SHEET_NAME = "Sheet1";
    const API_KEY = "AIzaSyBayWQDOC1xhIlrzyzG9pFNEaKKh8wjFhY";

    // ... (All your existing code: ZONE_LOCATIONS, allData, currentStartDate, etc.) ...

    let timeSeriesChart, locationChart, sourceChart;

    // ==================== NEW CHART FUNCTIONS ====================

    function createCharts() {
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: true, position: 'top', labels: { color: 'var(--text2)', boxWidth: 12, padding: 15 } },
                tooltip: { backgroundColor: 'var(--s1)', titleColor: 'var(--text)', bodyColor: 'var(--text2)' }
            }
        };

        // Time Series Chart
        timeSeriesChart = new Chart(document.getElementById('timeSeriesChart'), {
            type: 'line',
            options: {
                ...commonOptions,
                scales: {
                    x: { grid: { color: 'var(--border)' }, ticks: { color: 'var(--text3)' } },
                    y: { grid: { color: 'var(--border)' }, ticks: { color: 'var(--text3)' }, beginAtZero: true }
                }
            }
        });

        // Location Bar Chart
        locationChart = new Chart(document.getElementById('locationChart'), {
            type: 'bar',
            options: {
                ...commonOptions,
                indexAxis: 'y',
                scales: {
                    x: { grid: { color: 'var(--border)' }, ticks: { color: 'var(--text3)' } },
                    y: { grid: { color: 'var(--border)' }, ticks: { color: 'var(--text3)' } }
                }
            }
        });

        // Source Pie Chart
        sourceChart = new Chart(document.getElementById('sourceChart'), {
            type: 'doughnut',
            options: {
                ...commonOptions,
                cutout: '65%',
                plugins: {
                    legend: { position: 'right' }
                }
            }
        });
    }

    function updateCharts(filteredData) {
        // 1. Time Series (Daily)
        const dateMap = {};
        filteredData.forEach(row => {
            const date = parseFlexibleDate(row[0]);
            if (date) {
                const key = date.toISOString().split('T')[0];
                dateMap[key] = (dateMap[key] || 0) + 1;
            }
        });

        const sortedDates = Object.keys(dateMap).sort();
        timeSeriesChart.data = {
            labels: sortedDates,
            datasets: [{
                label: 'Leads',
                data: sortedDates.map(d => dateMap[d]),
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                tension: 0.3,
                borderWidth: 3,
                pointRadius: 3
            }]
        };
        timeSeriesChart.update();

        // 2. Location Bar Chart (Top 8)
        const locMap = {};
        filteredData.forEach(r => {
            if (r[3]) locMap[r[3]] = (locMap[r[3]] || 0) + 1;
        });
        const topLocations = Object.entries(locMap)
            .sort((a,b) => b[1] - a[1])
            .slice(0, 8);

        locationChart.data = {
            labels: topLocations.map(item => item[0]),
            datasets: [{
                label: 'Leads',
                data: topLocations.map(item => item[1]),
                backgroundColor: '#60a5fa',
                borderColor: '#3b82f6',
                borderWidth: 1,
                borderRadius: 6
            }]
        };
        locationChart.update();

        // 3. Source Pie Chart
        const srcMap = {};
        filteredData.forEach(r => {
            const src = r[2] || 'Unknown';
            srcMap[src] = (srcMap[src] || 0) + 1;
        });

        const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#6366f1'];
        sourceChart.data = {
            labels: Object.keys(srcMap),
            datasets: [{
                data: Object.values(srcMap),
                backgroundColor: colors,
                borderColor: 'var(--s1)',
                borderWidth: 3
            }]
        };
        sourceChart.update();
    }

    // Override renderDashboard to also update charts
    function renderDashboard() {
        if (!allData.length) return;

        const leads = filterData();

        // Existing stats and project list code...
        const projectMap = new Map();
        const uniqueLocs = new Set();
        const uniqueSrcs = new Set();

        leads.forEach(r => {
            if (!r[1]) return;
            if (!projectMap.has(r[1])) projectMap.set(r[1], { count: 0, location: r[3] || 'Unknown' });
            projectMap.get(r[1]).count++;
            if (r[3]) uniqueLocs.add(r[3]);
            if (r[2]) uniqueSrcs.add(r[2]);
        });

        document.getElementById('totalLeads').innerText = leads.length.toLocaleString();
        document.getElementById('totalProjects').innerText = projectMap.size.toLocaleString();
        document.getElementById('totalLocations').innerText = uniqueLocs.size.toLocaleString();
        document.getElementById('totalSources').innerText = uniqueSrcs.size.toLocaleString();

        // Render projects list (your existing code)
        const sorted = Array.from(projectMap.entries()).sort((a,b) => b[1].count - a[1].count);
        const list = document.getElementById('projectList');
        list.innerHTML = sorted.length ? 
            sorted.map(([name, data]) => `
                <div class="project-item" onclick='showProjectDetails(${JSON.stringify(name)})'>
                    <div class="project-info"><span class="project-name">${escapeHtml(name)}</span></div>
                    <div class="project-location-center">${escapeHtml(data.location)}</div>
                    <div class="project-count">${data.count.toLocaleString()} leads</div>
                </div>
            `).join('') : 
            '<div class="no-data">No leads match selected filters</div>';

        // Update Charts
        updateCharts(leads);

        // Last updated text
        document.getElementById('lastUpdated').innerHTML = 
            `${new Date().toLocaleTimeString()} | ${leads.length.toLocaleString()} leads`;
    }

    // Initialize everything
    window.onload = function() {
        createCharts();
        // Your existing initialization
        const savedTheme = localStorage.getItem('leads_theme') || 'dark';
        setTheme(savedTheme);
        bindEvents();
        setupZoneSlider();
        fetchData();
    };
</script>
</body>
</html>
