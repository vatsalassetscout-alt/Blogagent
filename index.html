<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Asset Scout | RankTrack Pro — Keyword Rank Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #060a12;
            --s1: #0d1420;
            --s2: #111c2e;
            --s3: #172035;
            --border: #1e2d45;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --purple: #8b5cf6;
        }
        [data-theme="light"] {
            --bg: #f0f4fa;
            --s1: #ffffff;
            --s2: #f5f8ff;
            --s3: #eaf0fb;
            --border: #d1ddf0;
            --text: #0f172a;
            --text2: #475569;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
        }
        .card { background: var(--s1); border: 1px solid var(--border); border-radius: 1.5rem; }
        .btn-primary { background: var(--blue); border-radius: 1rem; padding: 0.6rem 1.4rem; font-weight: 600; cursor: pointer; color: white; border: none; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-outline { background: var(--s2); border: 1px solid var(--border); border-radius: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
        .filter-input, select, input { background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; padding: 0.6rem 1rem; color: var(--text); outline: none; }
        .rank-badge { border-radius: 40px; padding: 0.2rem 0.9rem; display: inline-block; font-size: 0.85rem; }
        .rank-top1 { background: rgba(16,185,129,0.2); color: #10b981; }
        .rank-top3 { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .rank-other { background: var(--s3); color: var(--text2); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--s1); border-left: 4px solid var(--blue); border-radius: 12px; padding: 12px 20px; z-index: 200; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div class="max-w-screen-2xl mx-auto px-5 md:px-7 pt-5">
        <!-- Header -->
        <div class="card flex justify-between items-center px-7 py-4 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">AS</div>
                <div class="text-2xl font-bold">RankTrack <span class="text-sm text-[var(--text2)]">Pro</span></div>
            </div>
            <div class="flex gap-3">
                <button id="apiSettingsBtn" class="btn-outline text-sm"><i class="fas fa-key"></i> API Key</button>
                <button id="themeBtn" class="btn-outline text-sm">🌙</button>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="card p-5 mb-8">
            <div class="flex flex-wrap gap-4">
                <input type="text" id="searchInput" placeholder="Search keyword or domain..." class="filter-input flex-1">
                <select id="rankFilter" class="w-44">
                    <option value="all">All Rankings</option>
                    <option value="top1">Position #1</option>
                    <option value="top3">Top 3</option>
                    <option value="top10">Top 10</option>
                </select>
                <button id="updateRankingsBtn" class="btn-primary"><i class="fas fa-sync-alt"></i> Update</button>
                <button id="addDomainBtn" class="btn-outline"><i class="fas fa-plus-circle"></i> Domain</button>
                <button id="addKeywordBtn" class="btn-primary"><i class="fas fa-key"></i> Add Keyword</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div class="card p-5"><div class="text-[var(--text2)] text-sm">Domains</div><div class="text-4xl font-black" id="statDomains">0</div></div>
            <div class="card p-5"><div class="text-[var(--text2)] text-sm">Keywords</div><div class="text-4xl font-black" id="statKeywords">0</div></div>
            <div class="card p-5"><div class="text-[var(--text2)] text-sm">Top 3</div><div class="text-4xl font-black" id="statTop3">0</div></div>
            <div class="card p-5"><div class="text-[var(--text2)] text-sm">Avg Position</div><div class="text-4xl font-black" id="statAvgPos">—</div></div>
        </div>

        <!-- Table -->
        <div class="card overflow-hidden">
            <div class="px-7 py-4 border-b border-[var(--border)] bg-[var(--s2)]">
                <h2 class="font-bold"><i class="fas fa-chart-line text-blue-500 mr-2"></i> Keyword Rankings</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-[var(--blue)] text-white">
                        <tr><th class="px-6 py-4 text-left">Keyword</th><th class="px-4 py-4 text-left">Domain</th><th class="px-4 py-4 text-left">Position</th><th class="px-4 py-4 text-left">Change</th><th class="px-8 py-4 text-right">Actions</th></tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-[var(--border)]"></tbody>
                </table>
            </div>
            <div id="emptyMsg" class="text-center py-12 text-[var(--text2)] hidden">No keywords found</div>
        </div>
    </div>

    <!-- Modals -->
    <div id="domainModal" class="modal hidden">
        <div class="card w-full max-w-md p-6"><h3 class="text-xl font-bold mb-4">Add Domain</h3><input id="domainInput" class="filter-input w-full mb-5" placeholder="example.com"><div class="flex gap-3"><button id="closeDomainModal" class="flex-1 btn-outline">Cancel</button><button id="saveDomainBtn" class="flex-1 btn-primary">Save</button></div></div>
    </div>
    <div id="keywordModal" class="modal hidden">
        <div class="card w-full max-w-md p-6"><h3 class="text-xl font-bold mb-4">Track Keyword</h3><input id="keywordInput" class="filter-input w-full mb-3" placeholder="keyword"><select id="domainSelect" class="filter-input w-full mb-3"></select><input id="initPosition" class="filter-input w-full" placeholder="Initial position" value="10"><div class="flex gap-3 mt-5"><button id="closeKeywordModal" class="flex-1 btn-outline">Cancel</button><button id="saveKeywordBtn" class="flex-1 btn-primary">Track</button></div></div>
    </div>
    <div id="apiModal" class="modal hidden">
        <div class="card w-full max-w-md p-6"><h3 class="text-xl font-bold mb-2">SERP API Key</h3><p class="text-xs text-[var(--text2)] mb-4">Enter your SerpAPI key</p><input id="apiKeyInput" class="filter-input w-full mb-4" placeholder="API key"><button id="saveApiBtn" class="btn-primary w-full">Save</button><button id="closeApiModal" class="w-full mt-3 text-[var(--text2)]">Close</button></div>
    </div>

    <script>
        // Data stores
        let domains = JSON.parse(localStorage.getItem('domains') || '[{"id":1,"name":"assetscout.in"},{"id":2,"name":"example.com"}]');
        let keywords = JSON.parse(localStorage.getItem('keywords') || '[]');
        let apiKey = localStorage.getItem('serp_api_key') || '';
        let charts = {};

        // Initialize demo data if empty
        if(keywords.length === 0) {
            keywords = [
                { id: 101, keyword: "seo tools", domainId: 1, domainName: "assetscout.in", position: 3, prevPosition: 5, lastUpdated: new Date().toISOString() },
                { id: 102, keyword: "rank tracker", domainId: 1, domainName: "assetscout.in", position: 8, prevPosition: 9, lastUpdated: new Date().toISOString() },
                { id: 103, keyword: "keyword research", domainId: 2, domainName: "example.com", position: 1, prevPosition: 2, lastUpdated: new Date().toISOString() }
            ];
            localStorage.setItem('keywords', JSON.stringify(keywords));
        }

        function saveData() { localStorage.setItem('domains', JSON.stringify(domains)); localStorage.setItem('keywords', JSON.stringify(keywords)); }
        function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('rankFilter').value;
            let filtered = keywords.filter(k => !search || k.keyword.toLowerCase().includes(search) || k.domainName.toLowerCase().includes(search));
            if(filter !== 'all') {
                if(filter === 'top1') filtered = filtered.filter(k => k.position === 1);
                else if(filter === 'top3') filtered = filtered.filter(k => k.position <= 3);
                else if(filter === 'top10') filtered = filtered.filter(k => k.position <= 10);
            }
            const tbody = document.getElementById('tableBody');
            if(filtered.length === 0) { tbody.innerHTML = ''; document.getElementById('emptyMsg').classList.remove('hidden'); return; }
            document.getElementById('emptyMsg').classList.add('hidden');
            tbody.innerHTML = filtered.map(k => {
                const rankClass = k.position === 1 ? 'rank-top1' : (k.position <= 3 ? 'rank-top3' : 'rank-other');
                const change = k.prevPosition ? k.prevPosition - k.position : 0;
                const changeIcon = change > 0 ? '<i class="fas fa-arrow-up text-green-500"></i>' : (change < 0 ? '<i class="fas fa-arrow-down text-red-500"></i>' : '<i class="fas fa-minus text-gray-500"></i>');
                return `<tr><td class="px-6 py-4 font-medium">${escapeHtml(k.keyword)}</td><td class="px-4 py-4 text-[var(--text2)]">${escapeHtml(k.domainName)}</td><td class="px-4 py-4"><span class="rank-badge ${rankClass}">#${k.position || '—'}</span></td><td class="px-4 py-4">${changeIcon} ${Math.abs(change) || ''}</td><td class="px-8 py-4 text-right"><button onclick="deleteKeyword(${k.id})" class="text-red-400"><i class="fas fa-trash-alt"></i></button></td></tr>`;
            }).join('');
            updateStats();
        }

        function updateStats() {
            document.getElementById('statDomains').innerText = domains.length;
            document.getElementById('statKeywords').innerText = keywords.length;
            document.getElementById('statTop3').innerText = keywords.filter(k => k.position > 0 && k.position <= 3).length;
            const valid = keywords.filter(k => k.position > 0);
            const avg = valid.length ? (valid.reduce((a,b)=>a+b.position,0)/valid.length).toFixed(1) : '—';
            document.getElementById('statAvgPos').innerHTML = avg;
        }

        window.deleteKeyword = function(id) {
            if(confirm('Delete this keyword?')) { keywords = keywords.filter(k => k.id !== id); saveData(); renderTable(); showToast('Keyword deleted'); }
        }

        function renderDomainSelect() {
            const select = document.getElementById('domainSelect');
            select.innerHTML = domains.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
        }

        // Add Domain
        document.getElementById('addDomainBtn').onclick = () => document.getElementById('domainModal').classList.remove('hidden');
        document.getElementById('closeDomainModal').onclick = () => document.getElementById('domainModal').classList.add('hidden');
        document.getElementById('saveDomainBtn').onclick = () => {
            const name = document.getElementById('domainInput').value.trim().toLowerCase();
            if(name) { domains.push({ id: Date.now(), name }); saveData(); renderDomainSelect(); renderTable(); document.getElementById('domainModal').classList.add('hidden'); document.getElementById('domainInput').value = ''; showToast(`Domain ${name} added`); }
        };

        // Add Keyword
        document.getElementById('addKeywordBtn').onclick = () => { renderDomainSelect(); document.getElementById('keywordModal').classList.remove('hidden'); };
        document.getElementById('closeKeywordModal').onclick = () => document.getElementById('keywordModal').classList.add('hidden');
        document.getElementById('saveKeywordBtn').onclick = () => {
            const keyword = document.getElementById('keywordInput').value.trim();
            const domainId = parseInt(document.getElementById('domainSelect').value);
            const pos = parseInt(document.getElementById('initPosition').value) || 10;
            const domain = domains.find(d => d.id === domainId);
            if(keyword && domain) {
                keywords.push({ id: Date.now(), keyword, domainId, domainName: domain.name, position: pos, prevPosition: pos, lastUpdated: new Date().toISOString() });
                saveData(); renderTable(); document.getElementById('keywordModal').classList.add('hidden'); document.getElementById('keywordInput').value = ''; showToast(`Keyword "${keyword}" added`);
            }
        };

        // API Settings
        document.getElementById('apiSettingsBtn').onclick = () => { document.getElementById('apiKeyInput').value = apiKey; document.getElementById('apiModal').classList.remove('hidden'); };
        document.getElementById('closeApiModal').onclick = () => document.getElementById('apiModal').classList.add('hidden');
        document.getElementById('saveApiBtn').onclick = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) { apiKey = key; localStorage.setItem('serp_api_key', key); showToast('API Key saved'); document.getElementById('apiModal').classList.add('hidden'); }
        };

        // Update Rankings via SerpAPI
        document.getElementById('updateRankingsBtn').onclick = async () => {
            if(!apiKey) { showToast('Please set API key first'); document.getElementById('apiSettingsBtn').click(); return; }
            if(!keywords.length) { showToast('No keywords to track'); return; }
            showToast('Fetching rankings...');
            for(let i = 0; i < keywords.length; i++) {
                const kw = keywords[i];
                const url = `https://serpapi.com/search.json?q=${encodeURIComponent(kw.keyword)}&api_key=${apiKey}&num=100`;
                try {
                    const resp = await fetch(url);
                    const data = await resp.json();
                    const organic = data.organic_results || [];
                    let newPos = 0;
                    for(let idx = 0; idx < organic.length; idx++) {
                        if(organic[idx].link && organic[idx].link.toLowerCase().includes(kw.domainName.toLowerCase())) {
                            newPos = idx + 1;
                            break;
                        }
                    }
                    kw.prevPosition = kw.position;
                    kw.position = newPos || 0;
                    kw.lastUpdated = new Date().toISOString();
                } catch(e) { console.error(e); }
                await new Promise(r => setTimeout(r, 1000));
            }
            saveData();
            renderTable();
            showToast('Rankings updated!');
        };

        // Theme toggle
        let isDark = true;
        document.getElementById('themeBtn').onclick = () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('themeBtn').innerHTML = isDark ? '🌙' : '☀️';
        };

        // Search & filter
        document.getElementById('searchInput').addEventListener('input', () => renderTable());
        document.getElementById('rankFilter').addEventListener('change', () => renderTable());

        function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

        renderTable();
    </script>
</body>
</html>
