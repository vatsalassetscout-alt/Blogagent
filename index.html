<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Responsive Gallery | Desktop Hover-Expand + Mobile Swipe</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Swiper JS (only for mobile, but loaded conditionally) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- Fancybox 5 for lightbox (both layouts) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }

    /* FULL WIDTH GALLERY — stretches edge to edge */
    .full-width-gallery {
      width: 100vw;
      position: relative;
      left: 50%;
      right: 50%;
      margin-left: -50vw;
      margin-right: -50vw;
      padding: 0;
      overflow: hidden;
    }

    .gallery-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    .section-heading {
      text-align: center;
      margin: 0 auto 40px auto;
      padding: 20px 24px 0 24px;
      max-width: 1200px;
    }

    .section-heading h2 {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 15px;
      position: relative;
      display: inline-block;
      letter-spacing: 1px;
    }

    .section-heading h2 span {
      color: #d46721;
    }

    .section-heading p {
      font-size: 18px;
      color: #cccccc;
      max-width: 700px;
      margin: 0 auto;
    }

    /* =========== DESKTOP LAYOUT (default - hover expand flex) =========== */
    .desktop-gallery {
      display: flex;
      width: 100%;
    }

    .desktop-gallery .gallery_wrap {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 40vh;
      min-height: 420px;
      overflow: hidden;
    }

    .desktop-gallery .gallery_img {
      flex: 1;
      height: 100%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: flex 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      overflow: hidden;
    }

    .desktop-gallery .gallery_img:hover {
      flex: 7;
    }

    .desktop-gallery .gallery_img h3 {
      position: absolute;
      bottom: 20px;
      left: 25px;
      color: #ffe7c9;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
      z-index: 2;
      margin: 0;
      pointer-events: none;
      letter-spacing: 1px;
    }

    .desktop-gallery .overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: #fff;
      width: 188px;
      height: 38px;
      align-items: center;
      justify-content: center;
      display: flex;
      transition: transform 0.3s ease;
      transform: scale(0);
      transform-origin: bottom right;
      border-top-left-radius: 12px;
      box-shadow: -4px -2px 12px rgba(0,0,0,0.2);
      z-index: 5;
    }

    .desktop-gallery .gallery_img:hover .overlay {
      transform: scale(1);
    }

    .desktop-gallery .overlay a {
      color: #1a1a1a;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
    }

    .desktop-gallery .overlay a i {
      color: #ffffff;
      font-size: 19px;
      background-color: #ae8d45;
      padding: 7px;
      border-radius: 50%;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      transition: 0.2s;
    }

    .desktop-gallery .overlay a:hover i {
      background-color: #d46721;
      transform: scale(1.05);
    }

    /* =========== MOBILE LAYOUT (Swiper Carousel - hidden on desktop) =========== */
    .mobile-gallery {
      display: none;
      width: 100%;
    }

    .mobile-gallery .swiper {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .mobile-gallery .swiper-slide {
      width: 100%;
      height: auto;
    }

    .mobile-gallery .gallery-card {
      position: relative;
      width: 100%;
      height: 55vh;
      min-height: 400px;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border-radius: 0;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .mobile-gallery .gallery-card h3 {
      position: absolute;
      bottom: 20px;
      left: 25px;
      color: #ffe7c9;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
      z-index: 2;
      margin: 0;
      pointer-events: none;
      letter-spacing: 1px;
    }

    .mobile-gallery .overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: #fff;
      width: 188px;
      height: 38px;
      align-items: center;
      justify-content: center;
      display: flex;
      border-top-left-radius: 12px;
      box-shadow: -4px -2px 12px rgba(0,0,0,0.2);
      z-index: 5;
      /* on mobile, overlay always visible but subtle */
      opacity: 0.9;
    }

    .mobile-gallery .overlay a {
      color: #1a1a1a;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Montserrat', sans-serif;
    }

    .mobile-gallery .overlay a i {
      color: #ffffff;
      font-size: 18px;
      background-color: #ae8d45;
      padding: 6px;
      border-radius: 50%;
    }

    /* Swiper navigation & pagination for mobile */
    .mobile-gallery .swiper-button-next,
    .mobile-gallery .swiper-button-prev {
      color: #d46721;
      background: rgba(0,0,0,0.5);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
    }
    .mobile-gallery .swiper-button-next:after,
    .mobile-gallery .swiper-button-prev:after {
      font-size: 18px;
      font-weight: bold;
    }
    .mobile-gallery .swiper-pagination-bullet {
      background: #fff;
      opacity: 0.6;
    }
    .mobile-gallery .swiper-pagination-bullet-active {
      background: #d46721;
      opacity: 1;
    }

    /* Image backgrounds for both layouts */
    .gallery_img_1, .card-bg-1 { background-image: url('https://picsum.photos/id/104/1600/1200'); background-size: cover; background-position: center; }
    .gallery_img_2, .card-bg-2 { background-image: url('https://picsum.photos/id/106/1600/1200'); background-size: cover; background-position: center; }
    .gallery_img_3, .card-bg-3 { background-image: url('https://picsum.photos/id/107/1600/1200'); background-size: cover; background-position: center; }
    .gallery_img_4, .card-bg-4 { background-image: url('https://picsum.photos/id/116/1600/1200'); background-size: cover; background-position: center; }
    .gallery_img_5, .card-bg-5 { background-image: url('https://picsum.photos/id/119/1600/1200'); background-size: cover; background-position: center; }
    .gallery_img_6, .card-bg-6 { background-image: url('https://picsum.photos/id/20/1600/1200'); background-size: cover; background-position: center; }

    /* Responsive breakpoint: switch at 992px (tablet/mobile) */
    @media only screen and (max-width: 991px) {
      .desktop-gallery {
        display: none !important;
      }
      .mobile-gallery {
        display: block !important;
      }
      .section-heading h2 {
        font-size: 32px;
      }
      .section-heading p {
        font-size: 15px;
      }
      .mobile-gallery .gallery-card {
        height: 50vh;
        min-height: 380px;
      }
      .mobile-gallery .gallery-card h3 {
        font-size: 26px;
        bottom: 15px;
        left: 18px;
      }
      .mobile-gallery .overlay {
        width: 150px !important;
        height: 36px !important;
      }
    }

    @media only screen and (max-width: 576px) {
      .mobile-gallery .gallery-card {
        height: 48vh;
        min-height: 320px;
      }
      .mobile-gallery .gallery-card h3 {
        font-size: 20px;
      }
      .mobile-gallery .overlay {
        width: 130px !important;
        height: 32px !important;
      }
      .mobile-gallery .overlay a {
        font-size: 12px !important;
      }
      .mobile-gallery .overlay a i {
        font-size: 14px;
        padding: 5px;
      }
    }

    .demo-note {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.7;
      padding-bottom: 30px;
    }
    .device-hint {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 13px;
      margin-top: 15px;
    }
    .device-hint i {
      margin-right: 6px;
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
<script>
  (function() {
    // Helper to detect if mobile layout is active (based on CSS media query)
    function isMobileLayout() {
      return window.innerWidth <= 991;
    }
    
    // Update hint text based on layout
    function updateLayoutHint() {
      const hintSpan = document.getElementById('hintText');
      const desktopNote = document.querySelector('.desktop-note');
      const mobileNote = document.querySelector('.mobile-note');
      if (isMobileLayout()) {
        if (hintSpan) hintSpan.innerHTML = '<i class="fas fa-mobile-alt"></i> Mobile: Swipe to navigate • Tap image';
        if (desktopNote) desktopNote.style.display = 'none';
        if (mobileNote) mobileNote.style.display = 'inline';
      } else {
        if (hintSpan) hintSpan.innerHTML = '<i class="fas fa-desktop"></i> Desktop: Hover to expand images';
        if (desktopNote) desktopNote.style.display = 'inline';
        if (mobileNote) mobileNote.style.display = 'none';
      }
    }
    
    // Initialize Fancybox for both desktop and mobile groups
    // Desktop group
    if (document.querySelectorAll('[data-fancybox="desktop-gallery-group"]').length) {
      Fancybox.bind('[data-fancybox="desktop-gallery-group"]', {
        groupAll: true,
        infinite: false,
        protect: true,
        Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } },
        Thumbs: { autoStart: false },
        animated: true,
        dragToClose: true,
      });
    }
    
    // Mobile group
    if (document.querySelectorAll('[data-fancybox="mobile-gallery-group"]').length) {
      Fancybox.bind('[data-fancybox="mobile-gallery-group"]', {
        groupAll: true,
        infinite: true,
        protect: true,
        Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } },
        Thumbs: { autoStart: false },
        animated: true,
        dragToClose: true,
      });
    }
    
    // Initialize Swiper for mobile (only when mobile layout exists)
    let mobileSwiper = null;
    function initMobileSwiper() {
      if (document.querySelector('.mobile-gallery .swiper') && !mobileSwiper) {
        mobileSwiper = new Swiper('.mobileSwiper', {
          slidesPerView: 1,
          spaceBetween: 0,
          loop: true,
          grabCursor: true,
          touchRatio: 1,
          resistanceRatio: 0.85,
          pagination: { el: '.swiper-pagination', clickable: true, dynamicBullets: true },
          navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
          keyboard: { enabled: true },
          speed: 400,
          effect: 'slide',
        });
      }
    }
    
    // Add click/tap on mobile gallery cards to open lightbox (in addition to overlay)
    function bindMobileCardTap() {
      const mobileCards = document.querySelectorAll('.mobile-gallery .gallery-card');
      mobileCards.forEach(card => {
        card.removeEventListener('click', handleMobileCardClick);
        card.addEventListener('click', handleMobileCardClick);
      });
    }
    
    function handleMobileCardClick(e) {
      if (e.target.closest('.overlay')) return;
      const src = card.getAttribute('data-src');
      const caption = card.getAttribute('data-caption') || 'Gallery Image';
      if (!src) return;
      
      // Gather all mobile slides for gallery array
      const allSlides = [];
      document.querySelectorAll('.mobile-gallery .gallery-card').forEach(c => {
        let s = c.getAttribute('data-src');
        let cap = c.getAttribute('data-caption') || 'Image';
        if (s) allSlides.push({ src: s, caption: cap });
      });
      let startIndex = allSlides.findIndex(slide => slide.src === src);
      if (startIndex === -1) startIndex = 0;
      
      Fancybox.show(allSlides, {
        startIndex: startIndex,
        groupAll: true,
        infinite: true,
        protect: true,
        Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } },
        Carousel: { infinite: true }
      });
    }
    
    // Also bind desktop cards to open lightbox on click (excluding overlay area)
    function bindDesktopCardClick() {
      const desktopCards = document.querySelectorAll('.desktop-gallery .gallery_img');
      desktopCards.forEach(card => {
        card.removeEventListener('click', handleDesktopCardClick);
        card.addEventListener('click', handleDesktopCardClick);
      });
    }
    
    function handleDesktopCardClick(e) {
      if (e.target.closest('.overlay')) return;
      const src = card.getAttribute('data-src');
      const caption = card.getAttribute('data-caption') || 'Gallery Image';
      if (!src) return;
      
      const allSlides = [];
      document.querySelectorAll('.desktop-gallery .gallery_img').forEach(c => {
        let s = c.getAttribute('data-src');
        let cap = c.getAttribute('data-caption') || 'Image';
        if (s) allSlides.push({ src: s, caption: cap });
      });
      let startIndex = allSlides.findIndex(slide => slide.src === src);
      if (startIndex === -1) startIndex = 0;
      
      Fancybox.show(allSlides, {
        startIndex: startIndex,
        groupAll: true,
        infinite: false,
        protect: true,
        Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } }
      });
    }
    
    // Ensure overlay links within desktop also have proper data attributes already set.
    // Also, fix variable reference in handlers
    function bindAll() {
      bindDesktopCardClick();
      bindMobileCardTap();
    }
    
    // Initialize on load and resize to ensure swiper only loads when needed
    window.addEventListener('load', () => {
      updateLayoutHint();
      if (isMobileLayout()) {
        initMobileSwiper();
      }
      bindAll();
    });
    
    window.addEventListener('resize', () => {
      updateLayoutHint();
      if (isMobileLayout()) {
        if (!mobileSwiper) initMobileSwiper();
        else mobileSwiper.update();
      } else {
        if (mobileSwiper) {
          mobileSwiper.destroy(true, true);
          mobileSwiper = null;
        }
      }
      bindAll();
    });
    
    // Extra: assign card variable properly in handlers (re-declare inside each)
    // Fix handler scope
    function handleDesktopCardClick(e) {
      const card = e.currentTarget;
      if (e.target.closest('.overlay')) return;
      const src = card.getAttribute('data-src');
      const caption = card.getAttribute('data-caption') || 'Gallery Image';
      if (!src) return;
      const allSlides = [];
      document.querySelectorAll('.desktop-gallery .gallery_img').forEach(c => {
        let s = c.getAttribute('data-src');
        let cap = c.getAttribute('data-caption') || 'Image';
        if (s) allSlides.push({ src: s, caption: cap });
      });
      let startIndex = allSlides.findIndex(slide => slide.src === src);
      if (startIndex === -1) startIndex = 0;
      Fancybox.show(allSlides, { startIndex, groupAll: true, infinite: false, protect: true, Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } } });
    }
    
    function handleMobileCardClick(e) {
      const card = e.currentTarget;
      if (e.target.closest('.overlay')) return;
      const src = card.getAttribute('data-src');
      const caption = card.getAttribute('data-caption') || 'Gallery Image';
      if (!src) return;
      const allSlides = [];
      document.querySelectorAll('.mobile-gallery .gallery-card').forEach(c => {
        let s = c.getAttribute('data-src');
        let cap = c.getAttribute('data-caption') || 'Image';
        if (s) allSlides.push({ src: s, caption: cap });
      });
      let startIndex = allSlides.findIndex(slide => slide.src === src);
      if (startIndex === -1) startIndex = 0;
      Fancybox.show(allSlides, { startIndex, groupAll: true, infinite: true, protect: true, Toolbar: { display: { right: ["slideShow", "thumbs", "zoom", "fullScreen", "close"] } } });
    }
    
    // Re-attach correct handlers
    window.bindDesktopCardClick = function() {
      document.querySelectorAll('.desktop-gallery .gallery_img').forEach(card => {
        card.removeEventListener('click', handleDesktopCardClick);
        card.addEventListener('click', handleDesktopCardClick);
      });
    };
    window.bindMobileCardTap = function() {
      document.querySelectorAll('.mobile-gallery .gallery-card').forEach(card => {
        card.removeEventListener('click', handleMobileCardClick);
        card.addEventListener('click', handleMobileCardClick);
      });
    };
    window.bindDesktopCardClick();
    window.bindMobileCardTap();
    
    document.body.style.margin = '0';
    document.body.style.padding = '0';
    document.documentElement.style.overflowX = 'hidden';
  })();
</script>
</body>
</html>
